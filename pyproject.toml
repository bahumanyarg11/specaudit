[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "specaudit"
version = "0.1.0"
description = "Accuracy audit of special functions in SciPy, JAX and PyTorch against arbitrary-precision references"
readme = "README.md"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.10"
authors = [{ name = "Bahumanya R G" }]
keywords = ["special functions", "numerical accuracy", "ULP", "scipy", "jax", "pytorch", "mpmath"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24", "mpmath>=1.3", "scipy>=1.10"]

[project.optional-dependencies]
jax = ["jax>=0.4"]
torch = ["torch>=2.0"]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7", "ruff>=0.4", "matplotlib>=3.7"]

[project.scripts]
specaudit = "specaudit.cli:main"

[project.entry-points.pytest11]
specaudit = "specaudit.pytest_plugin"

[tool.setuptools.packages.find]
include = ["specaudit*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E741", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
