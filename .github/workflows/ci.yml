name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check ulpaudit tests
      - run: python -m pytest -q
      - name: Mini audit (SciPy only)
        run: ulpaudit run -l scipy,numpy -f erf,gamma,gammainc -n 200 -o out && ulpaudit report out/results.json -o out/ATLAS.md
